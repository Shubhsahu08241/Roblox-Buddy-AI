name: Generate DreamVerse Country Zones

on:
  push:
    paths-ignore:
      - 'Documentation/⭐ Signature Game/🏙️ DreamVerse/🏢 Building/🌍 WORLD COUNTRY ZONES/**'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate country documentation
        env:
          DATA_B64: 
          python - <<'PY'
          import os, json, gzip, base64, shutil
          from pathlib import Path
          payload=json.loads(gzip.decompress(base64.b64decode(os.environ['DATA_B64'])).decode('utf-8'))
          groups=payload['groups']; mainmap=payload['mainmap']; flags=payload['flags']; variants=payload['variants']
          root=Path('Documentation/⭐ Signature Game/🏙️ DreamVerse/🏢 Building/🌍 WORLD COUNTRY ZONES')
          root.mkdir(parents=True, exist_ok=True)
          for p in list(root.iterdir()):
              if p.is_dir() and p.name not in groups: shutil.rmtree(p)
              elif p.is_file() and p.name.isdigit(): p.unlink()
          def flag(iso): return ''.join(chr(127397+ord(x)) for x in iso)
          def key(c): return variants.get(c,c)
          for group,countries in groups.items():
              folder=root/group; folder.mkdir(parents=True,exist_ok=True)
              (folder/'README.md').write_text('# '+group+'\n\n**Country count:** '+str(len(countries))+'\n\nCountries:\n\n'+'\n'.join('- '+flag(flags[key(c)])+' '+key(c).upper() for c in countries)+'\n',encoding='utf-8')
              for c in countries:
                  k=key(c); main,loc,why=mainmap[c]
                  text=f'''# {flag(flags[k])} {k.upper()}\n\n## 🌍 REGION\n{group}\n\n## ⭐ MAIN REPRESENTATION\n{main}\n\n## 🏛️ STRUCTURE / LANDMARK\n{main} — {loc}\n\n## 📍 LOCATION\n{loc}, {k}\n\n## 🎯 WHY FAMOUS\n{why}.\n\n## 🌳 ENVIRONMENT\nCountry ke recognizable natural environment ko compact area mein represent kiya jayega.\n\n## 🏠 REPRESENTATIVE HOUSES\nLocal-style houses, compounds ya urban homes ka recognizable mix.\n\n## 🛍️ SHOPS / MARKET\nLocal market, craft stalls aur normal player-use shops.\n\n## 🍽️ FOOD AREA\nCountry ki recognizable food culture se inspired food area.\n\n## 🛣️ ROAD / STREET STYLE\nLocal city streets, connecting roads aur countryside routes ka mix.\n\n## 🎭 CULTURAL DETAILS\nArchitecture, patterns, colors, crafts aur other recognizable cultural details.\n\n## 🧍 NPC IDEAS\nFunny country-themed NPC behavior jo exploration ko interesting rakhe.\n\n## ⭐ SPECIAL FEATURE\nMain landmark ko zone ka memorable landmark moment banaya jayega.\n\n## 🔎 UNIQUE / RARE DISCOVERY\nHidden local discovery connected to the environment ya landmark.\n\n## 📝 BUILDING NOTES\nYe zone poori country ko clearly represent karega. Landmark, environment, houses, market, food, roads aur cultural details ko ek connected playable area ki tarah build kiya jayega.\n'''
                  (folder/f'{flag(flags[k])} {k.upper()}.md').write_text(text,encoding='utf-8')
          lines=['# 🌍 195 Country Zones — Master Index','', 'DreamVerse ke 195 country zones ko regional folders mein organize kiya gaya hai.','']
          n=0
          for group,countries in groups.items():
              lines += [f'## {group} — {len(countries)} Countries','']
              for c in countries:
                  n+=1; k=key(c); lines.append(f'{n}. {flag(flags[k])} {k.upper()}')
              lines.append('')
          (root/'🌍 195 Country Zones — Master Index.md').write_text('\n'.join(lines),encoding='utf-8')
          PY
      - name: Commit generated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Documentation/⭐\ Signature\ Game/🏙️\ DreamVerse/🏢\ Building/🌍\ WORLD\ COUNTRY\ ZONES
          git diff --cached --quiet && exit 0
          git commit -m "Generate 195 DreamVerse country zones"
          git push